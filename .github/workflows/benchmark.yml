name: benchmark

on:
  schedule:
    - cron: "0 6 * * 0" # Sunday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # Pins live in fetch.py, so unchanged pins reuse the datasets.
      - uses: actions/cache@v4
        with:
          path: evals/datasets/
          key: datasets-${{ hashFiles('src/billhook/fetch.py') }}

      - name: Fetch pinned datasets
        run: >-
          python -m billhook.fetch
          --fetch bipia
          --fetch injecagent-base
          --fetch notinject
          --fetch jailbreakbench
          --fetch dolly15k

      # --release refuses a dirty tree (OT-EVL-002, OT-BCH-007), and the check
      # runs before scoring. The benchmark writes evals/results/ on success, so
      # the comparison was scoring a dirty checkout and every scheduled run
      # failed. Park those artifacts outside the worktree, compare the same
      # pristine checkout, then put them back for the upload and commit below.
      - name: Run benchmark
        run: python -m billhook.run --suite v0_1 --detector regex-floor --release

      - name: Park benchmark artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/parked-results"
          count=0
          while IFS= read -r -d '' path; do
            [ -n "$path" ] || continue
            mkdir -p "$RUNNER_TEMP/parked-results/$(dirname "$path")"
            mv "$path" "$RUNNER_TEMP/parked-results/$path"
            count=$((count + 1))
          done < <(git ls-files --others --exclude-standard -z -- evals/results)
          if [ "$count" -eq 0 ]; then
            echo "benchmark --release wrote no untracked files under evals/results" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "worktree still dirty after parking benchmark artifacts:" >&2
            git status --porcelain >&2
            exit 1
          fi

      - name: Run comparison
        run: python -m billhook.compare --suite v0_1 --detector regex-floor --release

      - name: Restore benchmark artifacts
        run: |
          shopt -s nullglob
          parked=("$RUNNER_TEMP/parked-results/evals/results/"*)
          if ((${#parked[@]})); then
            mkdir -p evals/results
            mv "${parked[@]}" evals/results/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: evals/results/
          retention-days: 90

      # Committed artifacts are what OT-EVL-001 permits citing; they exist only
      # because the steps above ran on the pristine checkout first.
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/results/
          if git diff --cached --quiet; then
            echo "No new results to commit."
            exit 0
          fi
          git commit -m "benchmark: weekly v0_1 results"
          git push
